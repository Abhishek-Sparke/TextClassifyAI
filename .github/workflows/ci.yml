name: Continuous Integration & Pipeline Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    name: Python ML Pipeline & API Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Lint and Code Syntax Checks
      run: |
        # Check critical syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Validate ML Module Imports
      run: |
        python -c "import src.dataset, src.preprocessing, src.features, src.models, src.evaluate, src.inference_engine, src.explainability, src.error_analysis, src.model_validator; print('All core ML modules imported successfully.')"

    - name: Run Pipeline Integration & API Tests
      run: |
        python tests/test_pipeline.py

    - name: Run Production Stress Tests (55+ Scenarios)
      run: |
        python tests/stress_tests.py

  frontend-build:
    name: React Frontend Build & Verification
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm ci

    - name: Build Production Frontend Bundle
      run: |
        cd frontend
        npm run build
